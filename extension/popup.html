<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 12px 0; display: flex; align-items: center; }
    .url { font-size: 12px; color: #94a3b8; word-break: break-all; margin-bottom: 16px; background: #1e293b; padding: 8px; border-radius: 6px;}
    .result { display: flex; align-items: center; flex-direction: column; padding: 16px 0; border-top: 1px solid #334155; border-bottom: 1px solid #334155; margin-bottom: 16px; }
    .icon { width: 48px; height: 48px; margin-bottom: 12px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 14px; margin-bottom: 8px; }
    .danger { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .safe { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    .pending { color: #94a3b8; }
    .conf { font-size: 12px; color: #cbd5e1; }
    button { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-scan { background-color: #3b82f6; color: white; }
    .btn-scan:hover { background-color: #2563eb; }
    .btn-report { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.5); }
    .btn-report:hover { background-color: rgba(239, 68, 68, 0.3); }
    .link { text-align: center; font-size: 12px; color: #3b82f6; cursor: pointer; text-decoration: underline; margin-top: 8px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon16.png" style="margin-right: 8px;"> PhishNet Scan</h1>
  <div class="url" id="urlDisplay">Loading...</div>
  <div class="result" id="resultContainer">
    <img id="statusIcon" class="icon" src="icons/icon48.png">
    <div id="statusBadge" class="badge pending">Scanning...</div>
    <div id="confidence" class="conf"></div>
  </div>
  <button class="btn-scan" id="rescanBtn">Re-scan this page</button>
  <button class="btn-report" id="reportBtn" style="display: none;">Report as Phishing</button>
  <div class="link" id="dashboardLink">Open PhishNet Dashboard</div>
  <script src="popup.js"></script>
</body>
</html>
